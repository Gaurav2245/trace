events { worker_connections 1024; }

http {
    upstream trcpd_backend  { server trcpd-backend:8000; }
    upstream trcpd_frontend { server trcpd-frontend:80; }

    server {
        listen 80;
        server_name _;

        # API → FastAPI
        location ~ ^/(auth|users|logs|loops|fixes|debug|chat|breakpoints|dashboard|health|docs|redoc|openapi) {
            proxy_pass         http://trcpd_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_read_timeout 120s;
        }

        # WebSocket
        location /ws/ {
            proxy_pass         http://trcpd_backend/ws/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_read_timeout 86400;
        }

        # Everything else → React SPA
        location / {
            proxy_pass         http://trcpd_frontend;
            proxy_set_header   Host $host;
            proxy_http_version 1.1;
        }
    }
}
