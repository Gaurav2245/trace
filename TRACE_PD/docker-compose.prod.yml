# ──────────────────────────────────────────────────────────
#  TRACE_PD — Production compose
#  Differences from docker-compose.yml (dev):
#   - no source bind-mounts / --reload (image is immutable)
#   - backend runs via gunicorn + uvicorn workers (Dockerfile default CMD)
#   - Postgres port is NOT published to the host
#   - TRCPD_SECRET / TRCPD_DB_PASS are required, no insecure defaults
# ──────────────────────────────────────────────────────────
name: trcpd

services:

  trcpd-db:
    image: pgvector/pgvector:pg16
    container_name: trcpd_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${TRCPD_DB_USER:-trcpd_user}
      POSTGRES_PASSWORD: ${TRCPD_DB_PASS:?TRCPD_DB_PASS must be set for production}
      POSTGRES_DB:       ${TRCPD_DB_NAME:-trcpd_db}
    volumes:
      - trcpd_pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TRCPD_DB_USER:-trcpd_user} -d ${TRCPD_DB_NAME:-trcpd_db}"]
      interval: 8s
      timeout: 5s
      retries: 10
    networks:
      - trcpd_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  trcpd-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trcpd_backend
    restart: unless-stopped
    environment:
      DATABASE_URL:  postgresql+asyncpg://${TRCPD_DB_USER:-trcpd_user}:${TRCPD_DB_PASS:?TRCPD_DB_PASS must be set for production}@trcpd-db:5432/${TRCPD_DB_NAME:-trcpd_db}
      SECRET_KEY:    ${TRCPD_SECRET:?TRCPD_SECRET must be set for production}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_DEPLOYMENT_GPT4O: ${AZURE_DEPLOYMENT_GPT4O:-}
      ENVIRONMENT: production
      CORS_ORIGINS: ${TRCPD_CORS_ORIGINS:?TRCPD_CORS_ORIGINS must list your real frontend origin(s)}
    depends_on:
      trcpd-db:
        condition: service_healthy
    networks:
      - trcpd_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  trcpd-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${TRCPD_PUBLIC_API_URL:?TRCPD_PUBLIC_API_URL must be the public backend URL}
        VITE_WS_URL:  ${TRCPD_PUBLIC_WS_URL:?TRCPD_PUBLIC_WS_URL must be the public backend WS URL}
    container_name: trcpd_frontend
    restart: unless-stopped
    depends_on:
      - trcpd-backend
    networks:
      - trcpd_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  trcpd-nginx:
    image: nginx:alpine
    container_name: trcpd_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - trcpd-backend
      - trcpd-frontend
    networks:
      - trcpd_net

volumes:
  trcpd_pgdata:
    name: trcpd_pgdata

networks:
  trcpd_net:
    name: trcpd_net
    driver: bridge
